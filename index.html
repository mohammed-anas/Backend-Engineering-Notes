<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Software Engineering Notes</title>
    <meta
      name="description"
      content="A short, readable book of software engineering. First chapter: Redis as a leaderboard."
    />
    <meta id="theme-color" name="theme-color" content="#e4dcd0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,420..640;1,7..72,420..560&family=Outfit:wght@360..560&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var saved = localStorage.getItem("se-notes-theme");
        var theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="stage">
      <header class="chrome">
        <p class="brand">Software Engineering Notes</p>
        <p id="page-label" class="page-label" aria-live="polite">Cover</p>
        <div class="chrome-actions">
          <button type="button" id="contents">Contents</button>
          <button type="button" id="theme" aria-label="Read on night paper">
            <span class="lamp" aria-hidden="true"></span>
            <span id="theme-label">Night</span>
          </button>
        </div>
      </header>
      <div class="book-wrap">
        <div id="book" aria-label="Software Engineering Notes"></div>
      </div>
      <nav class="pager" aria-label="Turn the page">
        <button type="button" id="prev" aria-label="Previous page">
          <span aria-hidden="true">←</span>
        </button>
        <p class="pager-hint">Corners turn the page. Arrows do too.</p>
        <button type="button" id="next" aria-label="Next page">
          <span aria-hidden="true">→</span>
        </button>
      </nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
